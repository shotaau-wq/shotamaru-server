<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ヘコキゲーム</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:"Arial","Noto Sans JP",sans-serif}
#stage{
  position:relative;width:100vw;height:100vh;overflow:hidden;
  background:linear-gradient(#fff7cf 0 67%,#050505 67% 100%);
}
#guide{
  position:absolute;top:2.2%;left:50%;transform:translateX(-50%);
  width:92%;text-align:center;font-weight:900;font-size:clamp(18px,4.3vw,36px);
  color:#672200;text-shadow:0 2px #fff;z-index:20;
}
#combo{
  position:absolute;top:9%;left:50%;transform:translateX(-50%);
  font-weight:1000;font-size:clamp(20px,5vw,42px);color:#ff5a00;
  text-shadow:0 3px #fff;opacity:0;z-index:20;
}
#hero{
  position:absolute;left:50%;top:20%;width:min(43vw,290px);
  transform:translateX(-50%);transform-origin:center bottom;z-index:6;
  filter:drop-shadow(0 7px 4px #0003);
}
#ball{
  position:absolute;width:min(18vw,110px);right:-25%;top:42%;z-index:10;
  opacity:0;filter:drop-shadow(0 5px 3px #0004);
}
#fart{
  position:absolute;width:min(26vw,175px);left:19%;top:47%;z-index:5;
  opacity:0;transform-origin:right center;
}
#heart{
  position:absolute;width:min(25vw,165px);left:-30%;top:29%;z-index:12;
  opacity:0;filter:drop-shadow(0 5px 4px #0003);
}
#bubble{
  position:absolute;top:12%;left:50%;transform:translateX(-50%) scale(.8);
  padding:12px 18px;border-radius:24px;background:white;border:4px solid #ff5c86;
  color:#7a1740;font-size:clamp(18px,4.5vw,34px);font-weight:1000;
  opacity:0;z-index:30;white-space:nowrap;
}
#bottom{
  position:absolute;left:0;right:0;bottom:0;height:33%;
  color:white;padding:18px 20px;z-index:40;
}
#bottom .big{font-size:clamp(20px,5vw,34px);font-weight:1000}
#bottom .small{margin-top:10px;font-size:clamp(14px,3.5vw,22px);font-weight:700;color:#ddd}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
@keyframes ballFly{0%{right:-25%;transform:rotate(0) scale(.7);opacity:1}75%{right:43%;transform:rotate(-540deg) scale(1)}100%{right:48%;transform:rotate(-650deg) scale(.9);opacity:1}}
@keyframes heroHit{0%{transform:translateX(-50%) rotate(0)}30%{transform:translateX(-44%) rotate(6deg) scale(1.04)}60%{transform:translateX(-56%) rotate(-5deg)}100%{transform:translateX(-50%) rotate(0)}}
@keyframes fartPop{0%{opacity:0;transform:scale(.2) translateX(30px)}25%{opacity:1;transform:scale(1.25) translateX(-10px)}100%{opacity:0;transform:scale(1.8) translateX(-80px)}}
@keyframes heartFly{0%{left:-30%;opacity:1;transform:rotate(-15deg) scale(.7)}60%{left:38%;opacity:1;transform:rotate(8deg) scale(1.1)}100%{left:42%;opacity:0;transform:rotate(0) scale(1)}}
@keyframes bubblePop{0%{opacity:0;transform:translateX(-50%) scale(.5)}20%,80%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(.9)}}
@keyframes comboPop{0%{opacity:0;transform:translateX(-50%) scale(.5)}30%,75%{opacity:1;transform:translateX(-50%) scale(1.15)}100%{opacity:0;transform:translateX(-50%) scale(1)}}
@keyframes flash{0%{opacity:.75}100%{opacity:0}}
</style>

<style id="streamlabs-mobile-test">
html,body{background:transparent!important;background-color:transparent!important;}
body::before,body::after{background:transparent!important;}
#mobileTestBadge{position:fixed;left:50%;top:2.5%;transform:translateX(-50%);z-index:9999;padding:7px 14px;border-radius:999px;background:rgba(0,0,0,.58);color:white;font:800 13px/1.2 system-ui,sans-serif;pointer-events:none}
</style>

<script>
const hero=document.getElementById('hero'), ball=document.getElementById('ball'),
fart=document.getElementById('fart'), heart=document.getElementById('heart'),
bubble=document.getElementById('bubble'), comboEl=document.getElementById('combo'),
flash=document.getElementById('flash');
let combo=0, lastBall=0, busy=false;

function restart(el, anim){el.style.animation='none'; void el.offsetWidth; el.style.animation=anim;}
function baseball(){
  if(busy) return; busy=true;
  const now=Date.now(); combo=(now-lastBall<2500)?combo+1:1; lastBall=now;
  restart(ball,'ballFly .65s ease-in forwards');
  setTimeout(()=>{
    restart(hero,'heroHit .55s ease-out');
    restart(fart,'fartPop .8s ease-out forwards');
    restart(flash,'flash .18s ease-out');
    comboEl.textContent=combo>=2 ? `屁コンボ ×${combo}！` : 'ブッ！！💨';
    restart(comboEl,'comboPop .8s ease-out');
  },520);
  setTimeout(()=>{ball.style.opacity=0;busy=false},1050);
}
function heartme(){
  restart(heart,'heartFly 1.25s ease-out forwards');
  setTimeout(()=>restart(bubble,'bubblePop 2.2s ease-out forwards'),350);
}
document.addEventListener('keydown',e=>{
  if(e.key.toLowerCase()==='b') baseball();
  if(e.key.toLowerCase()==='h') heartme();
});
// Hooks for TikFinity/other integrations later:
window.triggerBaseball=baseball;
window.triggerHeartMe=heartme;
</script>

<script id="streamlabs-mobile-demo">
(function(){
 function ball(){try{if(typeof window.triggerBaseball==='function')window.triggerBaseball();}catch(e){}}
 function heart(){try{if(typeof window.triggerHeartMe==='function')window.triggerHeartMe();}catch(e){}}
 setTimeout(ball,2500);
 setTimeout(heart,7000);
 setInterval(function(){ball();setTimeout(heart,4500);},11000);
})();
</script>
